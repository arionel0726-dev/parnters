name: vizaje-partners

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped

    environment:
      POSTGRES_USER: partners
      POSTGRES_PASSWORD: partners_local_dev_only
      POSTGRES_DB: vizaje_partners

    ports:
      - "127.0.0.1:5434:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U partners -d vizaje_partners
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
